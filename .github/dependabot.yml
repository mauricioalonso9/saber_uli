# Actualizaciones de dependencias (T014; constitución IX).
#
# Los `ignore` llevan su motivo: se quitan cuando deja de aplicar.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
    ignore:
      # redis 8 obliga a kombu 5.7 en beta (2026-10); esperar a una kombu estable.
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # eslint-plugin-jsx-a11y 6.10.2 no admite ESLint 10 (2026-10).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.71 exige TypeScript < 6.1 (2026-10).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    ignore:
      # Solo versiones LTS de Node (pares); el salto a la siguiente LTS se hace a mano.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
