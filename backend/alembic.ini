# Alembic para desarrollo (crear revisiones). La ejecución en contenedores y pruebas no usa este
# archivo: `saber-uli migrate` arma la configuración por código.
#
#   cd backend
#   MIGRATION_DATABASE_URL=postgresql+asyncpg://saber_migrator:...@localhost:5432/saber_uli \
#     uv run alembic revision --autogenerate --rev-id 0002 -m "identity_schema"
#
# Sin `sqlalchemy.url`: la URL viene de MIGRATION_DATABASE_URL (ver migrations/env.py).

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
