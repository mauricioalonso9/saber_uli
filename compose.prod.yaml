# Saber Uli: producción (T012; research R-33).
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# Nginx termina TLS con tls.conf (redirige HTTP a HTTPS y envía HSTS). Los certificados se montan
# desde infra/docker/certs/ (fullchain.pem y privkey.pem; la carpeta está en .gitignore y
# .dockerignore). Sin Mailpit ni proveedor OIDC simulado: solo existen en el perfil e2e, que no se
# activa en producción.

services:
  proxy:
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./infra/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/docker/certs:/etc/nginx/certs:ro
    healthcheck:
      # En producción el puerto 8080 solo redirige; se comprueba el sitio HTTPS.
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:8443/"]

  api:
    environment:
      API_WORKERS: "4"
