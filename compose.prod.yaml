# Saber Uli: producción (T012; research R-33).
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# Nginx termina TLS con tls.conf (redirige HTTP a HTTPS y envía HSTS). Los certificados se montan
# desde infra/docker/certs/ (fullchain.pem y privkey.pem; la carpeta está en .gitignore y
# .dockerignore). Sin Mailpit ni proveedor OIDC simulado: solo existen en el perfil e2e, que no se
# activa en producción.
#
# Redis exige contraseña (REDIS_PASSWORD, T070a). Llega a redis-server por su configuración en la
# entrada estándar, no como argumento visible en `ps`, y a la API, al worker y a Beat dentro de
# REDIS_URL. Use una contraseña sin caracteres reservados de URL (por ejemplo, token_urlsafe).

x-redis-url: &redis-url
  REDIS_URL: redis://:${REDIS_PASSWORD:?Defina REDIS_PASSWORD en .env}@redis:6379/0

services:
  proxy:
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./infra/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/docker/certs:/etc/nginx/certs:ro
    healthcheck:
      # En producción el puerto 8080 solo redirige; se comprueba el sitio HTTPS.
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:8443/"]

  api:
    environment:
      <<: *redis-url
      API_WORKERS: "4"

  worker:
    environment:
      <<: *redis-url

  beat:
    environment:
      <<: *redis-url

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD en .env}
    command:
      - sh
      - -c
      - printf 'requirepass %s\n' "$$REDIS_PASSWORD" | redis-server - --save '' --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
