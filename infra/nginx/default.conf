# Proxy de Saber Uli para desarrollo y e2e (HTTP en el puerto 8080 de nginx-unprivileged).
#
# Despliegue de archivos (frontend/Dockerfile):
#   infra/nginx/default.conf           -> /etc/nginx/conf.d/default.conf
#   infra/nginx/security-headers.conf  -> /etc/nginx/saber/security-headers.conf
#   infra/nginx/locations.conf         -> /etc/nginx/saber/locations.conf
#   infra/nginx/tls.conf               -> /etc/nginx/saber/tls.conf
# Los fragmentos no van en conf.d/ porque Nginx incluye todo `conf.d/*.conf` en el contexto http.
# En producción, compose.prod.yaml monta tls.conf sobre /etc/nginx/conf.d/default.conf.

# Sin HSTS fuera de producción (cabecera vacía = no se envía).
map $host $saber_hsts {
    default "";
}

server_tokens off;

gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json application/problem+json application/manifest+json image/svg+xml;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    include /etc/nginx/saber/locations.conf;
}
