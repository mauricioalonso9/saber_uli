# Rutas del proxy, compartidas por default.conf (desarrollo y e2e) y tls.conf (producción).
# Se incluye dentro de un bloque `server`.

root /usr/share/nginx/html;
index index.html;

# API: se resuelve `api` en cada petición con el DNS de Docker para que el proxy arranque aunque
# la API todavía no esté lista.
location /api/ {
    include /etc/nginx/saber/security-headers.conf;
    add_header Cache-Control "no-store" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $saber_api http://api:8000;
    proxy_pass $saber_api;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    # Lotes de invitaciones (CSV) son el cuerpo más grande de la API.
    client_max_body_size 2m;
    proxy_read_timeout 60s;
}

# Service worker y manifiesto: siempre se revalidan para que la PWA se actualice.
location = /sw.js {
    include /etc/nginx/saber/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    include /etc/nginx/saber/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    default_type application/manifest+json;
    try_files $uri =404;
}

location = /registerSW.js {
    include /etc/nginx/saber/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Recursos con hash de Vite: inmutables.
location /assets/ {
    include /etc/nginx/saber/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Shell de la SPA: cualquier ruta desconocida entrega index.html, que nunca se guarda en caché.
location / {
    include /etc/nginx/saber/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
