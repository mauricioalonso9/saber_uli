# Registro de accesos sin datos personales (principio "cero datos personales en registros").
#
# Se copia a /etc/nginx/conf.d/00-logging.conf (contexto http). El formato `main` de la imagen
# guarda la IP del cliente y la línea de petición completa, con la consulta: las búsquedas de
# los listados (`?q=`) pueden llevar correos o nombres. Este formato guarda solo la ruta ($uri,
# sin consulta), sin IP ni User-Agent, como el log por petición de la API (T018, T070).
# Cada `server` declara `access_log ... saber`: así reemplaza al `access_log ... main` heredado
# del contexto http (repetirlo en http escribiría los dos).
#
# Cada `server` declara también `error_log ... crit`: los mensajes de nivel `error` (por ejemplo,
# la API no responde) copian la línea de petición con la consulta y su formato no se puede
# cambiar. Esas fallas se ven igual como 502/504 en este registro y con la alerta
# `readiness_check_failed` (quickstart, alertas operativas).

log_format saber escape=json
    '{"time":"$time_iso8601","event":"proxy_request","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time}';
