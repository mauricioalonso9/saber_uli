# Cabeceras de seguridad comunes (research R-33, constitución IX).
#
# Nginx no hereda `add_header` hacia una `location` que declara sus propias cabeceras, así que
# cada `location` de locations.conf incluye este archivo.
#
# CSP: los scripts solo pueden venir del mismo origen (sin 'unsafe-inline' ni 'unsafe-eval');
# la PWA registra el service worker con un archivo (`injectRegister: 'script'`), nunca en línea.
# Los estilos admiten 'unsafe-inline' porque Radix/shadcn y motion fijan estilos en línea.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# HSTS: `$saber_hsts` está vacío en default.conf (Nginx no envía cabeceras vacías) y solo tiene
# valor en tls.conf, que es la configuración de producción.
add_header Strict-Transport-Security $saber_hsts always;
