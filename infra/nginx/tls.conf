# Proxy de Saber Uli en producción: TLS en Nginx y HSTS (research R-33).
#
# compose.prod.yaml monta este archivo sobre /etc/nginx/conf.d/default.conf y los certificados
# en /etc/nginx/certs/{fullchain.pem,privkey.pem}; publica los puertos 80->8080 y 443->8443.

map $host $saber_hsts {
    default "max-age=63072000; includeSubDomains";
}

server_tokens off;

gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json application/problem+json application/manifest+json image/svg+xml;

# HTTP solo redirige a HTTPS.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    access_log /var/log/nginx/access.log saber;
    error_log /var/log/nginx/error.log crit;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log saber;
    error_log /var/log/nginx/error.log crit;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/saber/locations.conf;
}
