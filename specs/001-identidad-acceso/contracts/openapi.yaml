        '403': { $ref: '#/components/responses/Forbidden' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: su_refresh

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    UserId:
      { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    GroupId:
      { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    ProgramId:
      { name: programId, in: path, required: true, schema: { type: string, format: uuid } }
    InvitationId:
      { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    BatchId:
      { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
    PolicyVersionId:
      { name: policyVersionId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId:
      { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Unauthorized:
      description: |
        Sin sesión válida. `type`: `unauthenticated`, `session-revoked`, `account-disabled`,
        `guest-access-expired`, `guest-access-revoked` o `reauthentication-required`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConsentRequired:
      description: Falta autorización de datos vigente (`consent-required`, FR-014)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: El rol no permite esta función (`forbidden`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No existe o está fuera del alcance del usuario (`not-found`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicto con el estado actual (`conflict` u otro tipo específico)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Datos inválidos (`validation-error`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Demasiadas solicitudes (`rate-limited`)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Dependencia no disponible
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------------------------------------------------------- comunes
    Problem:
      type: object
      description: RFC 9457 Problem Details. `detail` está en español y nunca contiene datos personales.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ['urn:saber-uli:problem:guest-access-expired']
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          description: Errores de validación por campo
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, failed] }
    Accepted:
      type: object
      required: [message]
      properties:
        message: { type: string }
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    UserIdList:
      type: object
      required: [user_ids]
      additionalProperties: false
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }

    # ---------------------------------------------------------- sesión y cuenta
    SessionTokens:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Segundos (600) }
    Role:
      type: string
      enum: [student, guest, teacher, program_director, admin]
    Permission:
      type: string
      enum:
        - invitations:manage_own
        - invitations:manage_all
        - users:manage
        - groups:manage
        - groups:read_own_students
        - programs:read_aggregated
        - programs:manage
        - settings:manage
        - audit:read
        - policy:publish
        - deletions:read
    AccountStatus:
      type: string
      description: Estado visible, combinación del estado de la cuenta y del acceso de invitado.
      enum: [active, disabled, guest_expired, guest_revoked, deletion_pending, deleted]
    Me:
      type: object
      required: [id, kind, status, display_name, email, roles, permissions, onboarding, access]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [institutional, guest] }
        status: { $ref: '#/components/schemas/AccountStatus' }
        display_name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        onboarding:
          type: object
          required: [consent_required, profile_required]
          properties:
            consent_required: { type: boolean }
            current_policy_version_id: { type: string, format: uuid }
            profile_required: { type: boolean }
        access:
          type: object
          required: [valid, validated_at, offline_grace_until]
          properties:
            valid: { type: boolean }
            validated_at: { type: string, format: date-time }
            offline_grace_until:
              type: string
              format: date-time
              description: validated_at + 7 días (FR-038)
            guest_access_expires_at: { type: string, format: date-time }
            privileged_session: { type: boolean }
    Profile:
      type: object
      required: [daily_goal, complete]
      properties:
        program: { $ref: '#/components/schemas/Program' }
        semester: { type: integer, minimum: 1, maximum: 12 }
        expected_exam_date: { type: string, format: date }
        daily_goal: { type: string, enum: [casual, regular, intense] }
        guest_display_name: { type: string, maxLength: 120 }
        complete: { type: boolean }
    ProfileUpdate:
      type: object
      required: [daily_goal]
      additionalProperties: false
      description: |
        Institucional: `program_id`, `semester`, `expected_exam_date` y `daily_goal` son
        obligatorios. Invitado: `guest_display_name` y `daily_goal` obligatorios;
        `expected_exam_date` opcional; `program_id` y `semester` no se aceptan.
      properties:
        program_id: { type: string, format: uuid }
        semester: { type: integer, minimum: 1, maximum: 12 }
        expected_exam_date: { type: string, format: date }
        daily_goal: { type: string, enum: [casual, regular, intense] }
        guest_display_name: { type: string, minLength: 2, maxLength: 120 }
    PolicyVersion:
      type: object
      required: [id, version, title, body_markdown, effective_from]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        title: { type: string }
        body_markdown: { type: string }
        effective_from: { type: string, format: date-time }
    Consent:
      type: object
      required: [id, policy_version_id, policy_version, decision, channel, decided_at]
      properties:
        id: { type: string, format: uuid }
        policy_version_id: { type: string, format: uuid }
        policy_version: { type: string }
        decision: { type: string, enum: [accepted, rejected, revoked] }
        channel: { type: string }
        decided_at: { type: string, format: date-time }
    MySession:
      type: object
      required: [id, auth_method, started_at, last_activity_at, current]
      properties:
        id: { type: string, format: uuid }
        auth_method: { type: string, enum: [entra_id, guest_link] }
        started_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        current: { type: boolean, description: Es la sesión de esta petición }
    MySessionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MySession' } }
    DeletionRequest:
      type: object
      required: [id, status, origin, requested_at, due_date]
      properties:
        id: { type: string, format: uuid }
        user_id:
          type: string
          format: uuid
          description: Solo en vistas de administrador
        status: { type: string, enum: [received, in_progress, completed] }
        origin: { type: string, enum: [user_request, guest_retention, institutional_retention] }
        requested_at: { type: string, format: date-time }
        due_date: { type: string, format: date }
        completed_at: { type: string, format: date-time }
    DeletionRequestPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DeletionRequest' }
    PersonalDataExport:
      type: object
      required: [generated_at, identity, roles, consents]
      properties:
        generated_at: { type: string, format: date-time }
        identity:
          type: object
          properties:
            id: { type: string, format: uuid }
            kind: { type: string }
            display_name: { type: string }
            email: { type: string }
            created_at: { type: string, format: date-time }
            last_login_at: { type: string, format: date-time }
            source_note:
              type: string
              description: Explica que nombre y correo institucionales se corrigen en el directorio de Unilibre (escenario 8.2)
        profile: { $ref: '#/components/schemas/Profile' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        groups:
          type: array
          items: { type: string, description: Nombre del grupo }
        consents:
          type: array
          items: { $ref: '#/components/schemas/Consent' }
        invitation:
          type: object
          description: Solo invitados
          properties:
            accepted_at: { type: string, format: date-time }
            access_expires_at: { type: string, format: date-time }
        director_programs:
          type: array
          description: Programas que dirige (solo con el rol Director de programa)
          items: { $ref: '#/components/schemas/Program' }
        sessions:
          type: array
          description: Sesiones de la persona, de la más reciente a la más antigua
          items: { $ref: '#/components/schemas/PersonalDataSession' }
        audit_events:
          type: array
          description: |
            Eventos de auditoría sobre la persona, del más reciente al más antiguo. No identifican
            a quien hizo la acción: `actor` dice solo si fue la persona, el personal o el sistema.
          items: { $ref: '#/components/schemas/PersonalDataAuditEvent' }
        sections:
          type: object
          description: Secciones agregadas por otros contextos en especificaciones futuras
          additionalProperties: true

    PersonalDataSession:
      type: object
      required: [auth_method, started_at, last_seen_at, expires_at]
      properties:
        auth_method: { type: string, enum: [entra_id, guest_link] }
        started_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    PersonalDataAuditEvent:
      type: object
      required: [occurred_at, action, actor]
      properties:
        occurred_at: { type: string, format: date-time }
        action: { type: string }
        actor: { type: string, enum: [self, staff, system] }
        details: { type: object, additionalProperties: true }

    # ---------------------------------------------------------- programas
    Program:
      type: object
      required: [id, code, name, campus, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        campus: { type: string }
        active: { type: boolean }
    ProgramInput:
      type: object
      required: [code, name, campus]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z0-9-]{2,20}$' }
        name: { type: string, minLength: 3, maxLength: 200 }
        campus: { type: string, minLength: 2, maxLength: 100 }
        active: { type: boolean, default: true }
    ProgramPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 3, maxLength: 200 }
        campus: { type: string, minLength: 2, maxLength: 100 }
        active: { type: boolean }
    ProgramPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Program' }

    # ---------------------------------------------------------- invitaciones
    InvitationStatus:
      type: string
      enum: [sent, accepted, expired, revoked]
    Invitation:
      type: object
      description: |
        `email` e `invitee_name` son `null` cuando el invitado fue suprimido o cuando la
        invitación nunca aceptada superó su plazo de conservación (FR-034e).
      required: [id, status, access_expires_at, invited_by, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, 'null'], format: email }
        invitee_name: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        access_expires_at: { type: string, format: date-time }
        link_expires_at: { type: string, format: date-time }
        invited_by:
          type: [object, 'null']
          description: |
            `null` si la creó el sistema (comando de operación invite-guest). `display_name` es
            `null` si quien invitó fue suprimido.
          required: [id]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: [string, 'null'] }
        guest_user_id: { type: string, format: uuid }
        delivery_status: { type: string, enum: [queued, sent, failed] }
        retention_deletion_on:
          type: string
          format: date
          description: Fecha de supresión automática si el acceso ya terminó (FR-034a)
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    InvitationInput:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        invitee_name: { type: string, maxLength: 120 }
        access_expires_at:
          type: string
          format: date-time
          description: Si se omite, se usa `default_guest_access_days`.
    InvitationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Invitation' }
    InvitationBatch:
      type: object
      required: [id, status, valid_count, invalid_count, rows, expires_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending_confirmation, confirmed, expired] }
        valid_count: { type: integer }
        invalid_count: { type: integer }
        expires_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time }
        rows:
          type: array
          items:
            type: object
            required: [line, email, result]
            properties:
              line: { type: integer, minimum: 1 }
              email: { type: string }
              name: { type: string }
              access_expires_at: { type: string, format: date-time }
              result:
                type: string
                enum:
                  - valid
                  - invalid_email
                  - duplicate_in_file
                  - already_invited
                  - institutional_email
                  - expiry_out_of_range
              message: { type: string }

    # ---------------------------------------------------------- usuarios
    AdminUser:
      type: object
      description: Las cuentas en estado `deleted` no tienen datos personales (`display_name` y `email` son `null`).
      required: [id, kind, status, roles, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [institutional, guest] }
        status: { $ref: '#/components/schemas/AccountStatus' }
        display_name: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        director_programs:
          type: array
          items: { $ref: '#/components/schemas/Program' }
        last_login_at: { type: string, format: date-time }
        retention_deletion_on: { type: string, format: date }
        created_at: { type: string, format: date-time }
    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminUser' }

    # ---------------------------------------------------------- grupos
    GroupSummary:
      type: object
      required: [id, name, member_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cohort_label: { type: string }
        program_id: { type: string, format: uuid }
        member_count: { type: integer }
    Group:
      allOf:
        - $ref: '#/components/schemas/GroupSummary'
        - type: object
          required: [teachers, created_at]
          properties:
            description: { type: string }
            teachers:
              type: array
              items:
                type: object
                required: [id, display_name]
                properties:
                  id: { type: string, format: uuid }
                  display_name: { type: string }
            archived_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
    GroupInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        cohort_label: { type: string, maxLength: 20 }
        program_id: { type: string, format: uuid }
    GroupPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        cohort_label: { type: string, maxLength: 20 }
        archived: { type: boolean }
    GroupPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Group' }
    GroupStudent:
      type: object
      description: Vista del docente; nunca incluye el correo (FR-027).
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        progress:
          type: object
          description: Se completa en especificaciones posteriores (003, 008).
          additionalProperties: true
    GroupMember:
      type: object
      description: Vista del administrador (a diferencia de `GroupStudent`, incluye el correo).
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
    GroupMemberPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/GroupMember' }
    GroupStudentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/GroupStudent' }

    # ---------------------------------------------------------- parámetros y auditoría
    Settings:
      type: object
      required:
        - teacher_max_access_days
        - default_guest_access_days
        - invitation_link_ttl_days
        - sign_in_link_ttl_minutes
      properties:
        teacher_max_access_days: { type: integer, minimum: 1, maximum: 730 }
        default_guest_access_days: { type: integer, minimum: 1, maximum: 730 }
        invitation_link_ttl_days: { type: integer, minimum: 1, maximum: 30 }
        sign_in_link_ttl_minutes: { type: integer, minimum: 5, maximum: 10 }
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        teacher_max_access_days: { type: integer, minimum: 1, maximum: 730 }
        default_guest_access_days: { type: integer, minimum: 1, maximum: 730 }
        invitation_link_ttl_days: { type: integer, minimum: 1, maximum: 30 }
        sign_in_link_ttl_minutes: { type: integer, minimum: 5, maximum: 10 }
    AuditEvent:
      type: object
      required: [id, occurred_at, action, target_type]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_id:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        subject_user_id: { type: string, format: uuid }
        details:
          type: object
          additionalProperties: true
    AuditEventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditEvent' }
