openapi: 3.1.0
info:
  title: Saber Uli API — Identidad y acceso
  version: 1.0.0
  summary: Identidad, acceso institucional, invitados, roles, perfil y autorización de datos.
  description: |
    Contrato de la funcionalidad 001-identidad-acceso. Es la fuente de verdad para la
    implementación (principio III) y para generar el cliente del frontend (orval).

    Convenciones:
    - Los flujos de autenticación viven en `/api/auth` (sin versión, porque la URL de retorno
      está registrada en Microsoft Entra ID). Los recursos viven en `/api/v1`.
    - Autenticación con `Authorization: Bearer <token de acceso>`. El token de renovación viaja
      solo en la cookie `su_refresh` (HttpOnly, Secure, SameSite=Strict, Path=/api/auth).
    - Errores con RFC 9457 (`application/problem+json`). El campo `type` identifica la causa con
      un URN `urn:saber-uli:problem:<slug>`; ver `components.schemas.Problem`.
    - Listas paginadas con `page` (desde 1) y `page_size` (máximo 100).
    - Todas las rutas de `/api/v1` exigen autorización de datos vigente, salvo las marcadas con
      `x-consent-exempt: true` (FR-014).
    - Las rutas marcadas con `x-requires-privileged-session: true` exigen el claim `priv`
      (ver research R-15); sin él responden 401 `reauthentication-required`.
servers:
  - url: http://localhost
    description: Desarrollo local (detrás del proxy Nginx)
tags:
  - name: auth
    description: Ingreso institucional, invitados y sesión
  - name: me
    description: Cuenta propia, perfil, autorización y derechos del titular
  - name: policy
    description: Política de tratamiento de datos
  - name: programs
    description: Catálogo de programas académicos
  - name: invitations
    description: Invitaciones de invitados (Docente y Administrador)
  - name: teacher
    description: Funciones del docente sobre sus grupos
  - name: admin
    description: Administración de usuarios, grupos, parámetros, supresiones y auditoría
  - name: ops
    description: Salud del servicio

paths:
  # ---------------------------------------------------------------- ops
  /api/health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: El proceso está vivo
      security: []
      responses:
        '200':
          description: Vivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /api/ready:
    get:
      tags: [ops]
      operationId: getReadiness
      summary: Base de datos y Redis disponibles
      security: []
      responses:
        '200':
          description: Listo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------- auth
  /api/auth/microsoft/login:
    get:
      tags: [auth]
      operationId: startMicrosoftLogin
      summary: Inicia el ingreso con la cuenta institucional (FR-001)
      description: Redirige a Microsoft Entra ID con authorization code + PKCE.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: Ruta interna a la que volver tras el ingreso. Solo rutas relativas.
          schema: { type: string, pattern: '^/[^/].*$', maxLength: 200 }
      responses:
        '302':
          description: Redirección al proveedor de identidad institucional
          headers:
            Location: { schema: { type: string, format: uri } }
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/microsoft/callback:
    get:
      tags: [auth]
      operationId: completeMicrosoftLogin
      summary: Retorno desde Microsoft Entra ID (FR-002, FR-003, FR-005)
      description: |
        Valida state, nonce, firma del ID token, `iss` y `tid`. Si el inquilino no es el de
        Unilibre, redirige a `/ingresar?error=tenant_not_allowed` sin crear cuenta. Si es
        válido, crea o actualiza la cuenta, abre sesión, fija la cookie de renovación y redirige
        al frontend (`/bienvenida/datos`, `/bienvenida/perfil` o `return_to`).
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: Redirección al frontend (éxito o página de error con `error=<slug>`)
          headers:
            Location: { schema: { type: string } }
            Set-Cookie:
              description: Cookie `su_refresh` cuando el ingreso es exitoso
              schema: { type: string }
  /api/auth/guest/link-requests:
    post:
      tags: [auth]
      operationId: requestGuestSignInLink
      summary: Un invitado pide un enlace de ingreso (FR-013)
      description: Responde siempre 202 con el mismo cuerpo, exista o no el correo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Solicitud recibida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/guest/sessions:
    post:
      tags: [auth]
      operationId: createGuestSession
      summary: Consume un enlace de invitación o de ingreso (FR-007, FR-011)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
      responses:
        '200':
          description: Sesión abierta; fija la cookie `su_refresh`
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokens' }
        '400':
          description: Enlace inválido, usado o vencido (`access-link-invalid`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Acceso de invitado vencido o revocado (`guest-access-expired`, `guest-access-revoked`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Renueva el token de acceso y rota la cookie (FR-037, FR-038, FR-039)
      description: |
        Requiere la cookie `su_refresh` y la cabecera `X-Requested-With: saber-uli`. Valida que
        la cuenta siga activa, que el acceso de invitado no haya vencido ni sido revocado y que
        la sesión no haya superado 7 días de inactividad ni 30 días absolutos.
      security:
        - refreshCookie: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          schema: { type: string, const: saber-uli }
      responses:
        '200':
          description: Token renovado; la cookie se rota
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokens' }
        '401':
          description: |
            Sesión no renovable. `type` indica la causa: `session-expired`, `session-revoked`,
            `account-disabled`, `account-deleted`, `guest-access-expired`, `guest-access-revoked`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cierra la sesión actual (escenario 1.4)
      security:
        - refreshCookie: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          schema: { type: string, const: saber-uli }
      responses:
        '204':
          description: Sesión cerrada; la cookie se elimina
          headers:
            Set-Cookie: { schema: { type: string } }
        '401':
          description: |
            Falta la cookie `su_refresh` o la cabecera `X-Requested-With: saber-uli`
            (`unauthenticated`). La cookie se elimina igualmente.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------- me
  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Estado de la cuenta, roles, permisos y pasos pendientes del primer ingreso
      x-consent-exempt: true
      responses:
        '200':
          description: Cuenta actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/profile:
    get:
      tags: [me]
      operationId: getMyProfile
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
    put:
      tags: [me]
      operationId: updateMyProfile
      summary: Completa o edita el perfil (FR-019, FR-020, FR-021)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/consents:
    get:
      tags: [me]
      operationId: listMyConsents
      summary: Historial de autorizaciones (escenario 2.4, FR-018)
      x-consent-exempt: true
      responses:
        '200':
          description: Historial, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: object
                required: [current, items]
                properties:
                  current:
                    oneOf:
                      - $ref: '#/components/schemas/Consent'
                      - type: 'null'
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [me]
      operationId: decideConsent
      summary: Acepta o rechaza la versión vigente de la política (FR-015)
      x-consent-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_version_id, decision]
              additionalProperties: false
              properties:
                policy_version_id: { type: string, format: uuid }
                decision: { type: string, enum: [accepted, rejected] }
      responses:
        '201':
          description: Decisión registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: La versión indicada no es la vigente (`policy-version-not-current`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/consents/revocation:
    post:
      tags: [me]
      operationId: revokeConsent
      summary: Revoca la autorización vigente; suspende el acceso (escenario 2.5)
      x-consent-exempt: true
      responses:
        '201':
          description: Revocación registrada; las sesiones del usuario quedan revocadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: No hay autorización vigente (`no-active-consent`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      summary: Sesiones activas del usuario (FR-037a, escenario 1.5; ASVS 3.3.4)
      x-consent-exempt: true
      responses:
        '200':
          description: Sesiones activas, la más reciente primero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/sessions/{sessionId}/revocation:
    post:
      tags: [me]
      operationId: revokeMySession
      summary: Cierra una sesión propia; deja de servir en su siguiente petición (FR-037a)
      x-consent-exempt: true
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/me/sessions/revocation:
    post:
      tags: [me]
      operationId: revokeMyOtherSessions
      summary: Cierra todas las sesiones propias menos la actual (FR-037a)
      x-consent-exempt: true
      responses:
        '204': { description: Sesiones cerradas }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/data-export:
    get:
      tags: [me]
      operationId: exportMyData
      summary: Descarga todos los datos personales del usuario (FR-031)
      responses:
        '200':
          description: Archivo JSON
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalDataExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
  /api/v1/me/deletion-request:
    get:
      tags: [me]
      operationId: getMyDeletionRequest
      x-consent-exempt: true
      responses:
        '200':
          description: Solicitud en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [me]
      operationId: requestMyDeletion
      summary: Solicita la supresión de la cuenta y los datos (FR-032)
      x-consent-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              additionalProperties: false
              properties:
                confirmation:
                  type: string
                  const: ELIMINAR
                  description: Confirmación explícita que el usuario escribe
      responses:
        '202':
          description: Solicitud registrada; las sesiones terminan de inmediato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: |
            Ya existe una solicitud en curso (`deletion-already-requested`) o el usuario es el
            último administrador activo (`last-admin`, FR-034d).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- policy
  /api/v1/privacy-policy/current:
    get:
      tags: [policy]
      operationId: getCurrentPolicy
      summary: Versión vigente de la política (FR-016)
      security: []
      responses:
        '200':
          description: Política vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersion' }
  /api/v1/privacy-policy/versions/{policyVersionId}:
    get:
      tags: [policy]
      operationId: getPolicyVersion
      summary: Texto de una versión concreta (escenario 2.4)
      security: []
      parameters:
        - $ref: '#/components/parameters/PolicyVersionId'
      responses:
        '200':
          description: Versión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/privacy-policy/versions:
    post:
      tags: [admin, policy]
      operationId: publishPolicyVersion
      summary: Publica una nueva versión; exige nueva aceptación a todos (FR-017)
      x-requires-privileged-session: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, title, body_markdown, effective_from]
              additionalProperties: false
              properties:
                version: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
                title: { type: string, maxLength: 200 }
                body_markdown: { type: string, minLength: 200, maxLength: 100000 }
                effective_from: { type: string, format: date-time }
      responses:
        '201':
          description: Publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- programs
  /api/v1/programs:
    get:
      tags: [programs]
      operationId: listActivePrograms
      summary: Programas activos para completar el perfil
      responses:
        '200':
          description: Programas activos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Program' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConsentRequired' }
  /api/v1/admin/programs:
    get:
      tags: [admin, programs]
      operationId: adminListPrograms
      x-requires-privileged-session: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Programas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin, programs]
      operationId: adminCreateProgram
      summary: Crea un programa (FR-028)
      x-requires-privileged-session: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramInput' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Program' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/admin/programs/{programId}:
    patch:
      tags: [admin, programs]
      operationId: adminUpdateProgram
      x-requires-privileged-session: true
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgramPatch' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Program' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- invitations
  /api/v1/invitations:
    get:
      tags: [invitations]
      operationId: listInvitations
      summary: Lista invitaciones (docente solo las suyas; administrador todas) (FR-006)
      x-requires-privileged-session: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/InvitationStatus' }
        - name: invited_by
          in: query
          required: false
          description: Solo administradores; para un docente se ignora.
          schema: { type: string, format: uuid }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 254 } }
      responses:
        '200':
          description: Invitaciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Envía una invitación individual (escenario 5.1)
      x-requires-privileged-session: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '201':
          description: Invitación creada y encolada para envío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe una invitación vigente para ese correo (`invitation-already-active`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            Datos inválidos. `type` puede ser `validation-error`,
            `institutional-email-not-invitable` (FR-008) o `access-expiry-out-of-range` (FR-006a).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/invitations/{invitationId}:
    get:
      tags: [invitations]
      operationId: getInvitation
      x-requires-privileged-session: true
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [invitations]
      operationId: updateInvitationExpiry
      summary: Amplía, reduce o renueva el vencimiento del acceso (escenario 5.5)
      x-requires-privileged-session: true
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_expires_at]
              additionalProperties: false
              properties:
                access_expires_at: { type: string, format: date-time }
      responses:
        '200':
          description: Vencimiento actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El invitado ya fue suprimido y no puede renovarse (`guest-erased`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/invitations/{invitationId}/resend:
    post:
      tags: [invitations]
      operationId: resendInvitation
      summary: Reenvía una invitación no aceptada con un enlace nuevo
      x-requires-privileged-session: true
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '202':
          description: Reenvío encolado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/invitations/{invitationId}/revocation:
    post:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Revoca la invitación o el acceso del invitado (escenario 5.4, FR-010)
      x-requires-privileged-session: true
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Revocada; las sesiones del invitado terminan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/invitation-batches:
    post:
      tags: [invitations]
      operationId: validateInvitationBatch
      summary: Valida un lote de invitaciones y devuelve el reporte por fila (FR-009)
      x-requires-privileged-session: true
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              description: UTF-8 con encabezado `correo,nombre,vence`; máximo 500 filas.
          application/json:
            schema:
              type: object
              required: [rows]
              additionalProperties: false
              properties:
                default_access_expires_at: { type: string, format: date-time }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [email]
                    additionalProperties: false
                    properties:
                      email: { type: string, maxLength: 254 }
                      name: { type: string, maxLength: 120 }
                      access_expires_at: { type: string, format: date-time }
      responses:
        '201':
          description: Lote validado, pendiente de confirmación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationBatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Más de 500 filas (`batch-too-large`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/invitation-batches/{batchId}:
    get:
      tags: [invitations]
      operationId: getInvitationBatch
      x-requires-privileged-session: true
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Lote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationBatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/invitation-batches/{batchId}/confirmation:
    post:
      tags: [invitations]
      operationId: confirmInvitationBatch
      summary: Confirma el lote; crea y envía solo las filas válidas
      x-requires-privileged-session: true
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationBatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lote ya confirmado o vencido (`batch-not-pending`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

