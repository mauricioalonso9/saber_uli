openapi: 3.1.0
info:
  title: Saber Uli API — Banco de ítems
  version: 1.0.0
  summary: Banco de ítems, contextos, taxonomía, revisión, importación, exportación y cobertura.
  description: |
    Contrato de la funcionalidad 002-banco-items (research R-15). Es la fuente de verdad para la
    implementación (principio III) y para generar el cliente del frontend (orval, destino
    `src/api/content`). Las convenciones son las del contrato de 001:

    - Autenticación con `Authorization: Bearer <token de acceso>`.
    - Errores con RFC 9457 (`application/problem+json`); `type` es
      `urn:saber-uli:problem:<slug>`. Los componentes comunes (`Problem`, `PageMeta`, respuestas
      de error y paginación) son copias idénticas de los de 001.
    - Listas paginadas con `page` (desde 1) y `page_size` (máximo 100).
    - Todas las rutas exigen autorización de datos vigente (FR-014 de 001).
    - Las rutas con `x-requires-privileged-session: true` exigen sesión privilegiada (001/R-15).
    - `x-required-permission` indica el permiso que exige la ruta (research R-08):
      `content:author` (Docente y Administrador), `content:review` y `content:taxonomy_manage`
      (Administrador). Sin él, 403 `forbidden`.
    - Los ítems y contextos se identifican en la URL por su código de negocio (`LC-0001`).
    - Ediciones con bloqueo optimista (research R-09): `GET` devuelve `ETag` y las
      modificaciones exigen `If-Match`; si no coincide, 412 `edit-conflict`; sin él, 428
      `precondition-required`.
servers:
  - url: http://localhost
    description: Desarrollo local (detrás del proxy Nginx)
tags:
  - name: taxonomy
    description: Módulos, taxonomía, rúbricas y distribución objetivo
  - name: contexts
    description: Contextos compartidos e imágenes
  - name: items
    description: Ítems, versiones, revisión e historia
  - name: transfer
    description: Importación y exportación
  - name: insights
    description: Cobertura y estadísticas

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------- taxonomía
  /api/v1/content/modules:
    get:
      tags: [taxonomy]
      operationId: listContentModules
      summary: Módulos con su taxonomía completa, para formularios, filtros y cobertura
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - name: include_inactive
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Módulos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentModule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/content/modules/{moduleCode}:
    patch:
      tags: [taxonomy]
      operationId: updateContentModule
      summary: Cambia la meta de ítems del módulo para la cobertura (FR-040)
      x-requires-privileged-session: true
      x-required-permission: content:taxonomy_manage
      parameters:
        - $ref: '#/components/parameters/ModuleCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_target]
              additionalProperties: false
              properties:
                bank_target: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        '200':
          description: Módulo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentModule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/content/taxonomy-nodes:
    post:
      tags: [taxonomy]
      operationId: createTaxonomyNode
      summary: Agrega una categoría de la taxonomía (US9)
      x-requires-privileged-session: true
      x-required-permission: content:taxonomy_manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxonomyNodeCreate' }
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Código ya usado (`taxonomy-code-taken`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/content/taxonomy-nodes/{nodeId}:
    patch:
      tags: [taxonomy]
      operationId: updateTaxonomyNode
      summary: Edita nombre, descripción, peso objetivo o estado activo (FR-045)
      x-requires-privileged-session: true
      x-required-permission: content:taxonomy_manage
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxonomyNodeUpdate' }
      responses:
        '200':
          description: Categoría actualizada; `warnings` informa si los pesos del tipo no suman ~1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [taxonomy]
      operationId: deleteTaxonomyNode
      summary: Borra una categoría sin uso; si está en uso, se debe desactivar (FR-045)
      x-requires-privileged-session: true
      x-required-permission: content:taxonomy_manage
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '204': { description: Borrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La usa algún ítem, contexto o categoría hija (`taxonomy-node-in-use`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/content/rubrics:
    get:
      tags: [taxonomy]
      operationId: listRubrics
      x-requires-privileged-session: true
      x-required-permission: content:author
      responses:
        '200':
          description: Rúbricas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Rubric' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [taxonomy]
      operationId: createRubric
      x-requires-privileged-session: true
      x-required-permission: content:taxonomy_manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RubricInput' }
      responses:
        '201':
          description: Rúbrica creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rubric' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Código ya usado (`rubric-code-taken`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/content/rubrics/{rubricId}:
    put:
      tags: [taxonomy]
      operationId: updateRubric
      x-requires-privileged-session: true
      x-required-permission: content:taxonomy_manage
      parameters:
        - $ref: '#/components/parameters/RubricId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RubricInput' }
      responses:
        '200':
          description: Rúbrica actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rubric' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------- contextos
  /api/v1/content/media:
    post:
      tags: [contexts]
      operationId: uploadContentMedia
      summary: Sube una imagen (PNG, JPEG o WebP, ≤ 1 MB); se re-codifica sin metadatos (R-11)
      x-requires-privileged-session: true
      x-required-permission: content:author
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Imagen guardada (o ya existente con la misma huella)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Más de 1 MB (`file-too-large`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: No es PNG, JPEG ni WebP válido (`unsupported-media-type`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/content/media/{mediaId}:
    get:
      tags: [contexts]
      operationId: getContentMedia
      summary: Entrega una imagen (cacheable e inmutable)
      description: |
        Con `content:author`, cualquier imagen. Sin ese permiso, solo las imágenes de contextos
        usados por una versión Publicada o Retirada; las demás responden 404 (FR-046, R-11).
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Imagen
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, max-age=31536000, immutable' }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/content/contexts:
    get:
      tags: [contexts]
      operationId: listContexts
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - { name: module, in: query, required: false, schema: { $ref: '#/components/schemas/ModuleCodeValue' } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Contextos
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContextSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [contexts]
      operationId: createContext
      x-requires-privileged-session: true
      x-required-permission: content:author
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextCreate' }
      responses:
        '201':
          description: Contexto creado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Context' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Código ya usado (`code-taken`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/content/contexts/{contextCode}:
    get:
      tags: [contexts]
      operationId: getContext
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ContextCode'
      responses:
        '200':
          description: Contexto con su versión vigente y su uso (FR-026)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Context' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [contexts]
      operationId: updateContext
      summary: Crea una versión nueva del contexto; los ítems publicados que lo usan reciben versión nueva En revisión (FR-020)
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ContextCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextContent' }
      responses:
        '200':
          description: Contexto actualizado y ítems afectados
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextUpdateResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/EditConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ------------------------------------------------------------- ítems
  /api/v1/content/items:
    get:
      tags: [items]
      operationId: listItems
      summary: Busca y filtra el banco (SC-009)
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - { name: module, in: query, required: false, schema: { $ref: '#/components/schemas/ModuleCodeValue' } }
        - { name: state, in: query, required: false, schema: { $ref: '#/components/schemas/VersionState' } }
        - { name: origin, in: query, required: false, schema: { $ref: '#/components/schemas/Origin' } }
        - { name: difficulty, in: query, required: false, schema: { $ref: '#/components/schemas/Difficulty' } }
        - name: taxonomy_node
          in: query
          required: false
          description: Categoría de cualquier tipo; incluye sus descendientes
          schema: { type: string, format: uuid }
        - name: signal
          in: query
          required: false
          description: Señal de problema de las estadísticas (FR-043)
          schema: { $ref: '#/components/schemas/ProblemSignal' }
        - name: awaiting_my_review
          in: query
          required: false
          description: En revisión y que quien consulta puede aprobar (cola de revisión)
          schema: { type: boolean }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Ítems
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ItemSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [items]
      operationId: createItem
      summary: Crea un ítem o consigna en Borrador (FR-024)
      x-requires-privileged-session: true
      x-required-permission: content:author
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemCreate' }
      responses:
        '201':
          description: Ítem creado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Código ya usado (`code-taken`) o duplicado de otro ítem (`duplicate-item`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/content/items/{itemCode}:
    get:
      tags: [items]
      operationId: getItem
      summary: Ítem con su versión publicada y su versión abierta
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ItemCode'
      responses:
        '200':
          description: Ítem
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/content/items/{itemCode}/draft:
    put:
      tags: [items]
      operationId: saveItemDraft
      summary: Guarda la versión abierta; si no hay, crea una a partir de la vigente (FR-015, FR-016)
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ItemCode'
        - $ref: '#/components/parameters/IfMatch'
        - name: keep_in_review
          in: query
          required: false
          description: |
            Solo si la versión abierta está En revisión (FR-016): `true` la deja En revisión (la
            revisión empieza de nuevo); `false` la devuelve a Borrador. Se ignora en otros estados.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemDraftInput' }
      responses:
        '200':
          description: Versión abierta guardada
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicado de otro ítem (`duplicate-item`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '412': { $ref: '#/components/responses/EditConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/content/items/{itemCode}/submission:
    post:
      tags: [items]
      operationId: submitItem
      summary: Envía la versión en Borrador a revisión; exige contenido completo y válido
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ItemCode'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: En revisión
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '412': { $ref: '#/components/responses/EditConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/content/items/{itemCode}/approval:
    post:
      tags: [items]
      operationId: approveItem
      summary: Publica la versión En revisión (FR-012 a FR-015)
      x-requires-privileged-session: true
      x-required-permission: content:review
      parameters:
        - $ref: '#/components/parameters/ItemCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirms_alignment, confirms_originality]
              additionalProperties: false
              properties:
                confirms_alignment:
                  type: boolean
                  const: true
                  description: Verificó la alineación con la guía del ICFES (FR-014)
                confirms_originality:
                  type: boolean
                  const: true
                  description: No reproduce preguntas del ICFES (FR-014)
      responses:
        '200':
          description: Publicada; la publicada anterior, si la había, pasa a Retirada
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Sin permiso (`forbidden`) o quien aprueba creó o modificó la versión
            (`self-approval-forbidden`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '412': { $ref: '#/components/responses/EditConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/content/items/{itemCode}/return:
    post:
      tags: [items]
      operationId: returnItem
      summary: Devuelve la versión En revisión a Borrador con comentarios
      x-requires-privileged-session: true
      x-required-permission: content:review
      parameters:
        - $ref: '#/components/parameters/ItemCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '200':
          description: Devuelta a Borrador
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '412': { $ref: '#/components/responses/EditConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/content/items/{itemCode}/rejection:
    post:
      tags: [items]
      operationId: rejectItem
      summary: Rechaza la versión En revisión; pasa a Retirada con el motivo
      x-requires-privileged-session: true
      x-required-permission: content:review
      parameters:
        - $ref: '#/components/parameters/ItemCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200':
          description: Rechazada
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '412': { $ref: '#/components/responses/EditConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/content/items/{itemCode}/retirement:
    post:
      tags: [items]
      operationId: retireItem
      summary: Retira la versión publicada; deja de entregarse en la práctica nueva
      x-requires-privileged-session: true
      x-required-permission: content:review
      parameters:
        - $ref: '#/components/parameters/ItemCode'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200':
          description: Retirada
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '412': { $ref: '#/components/responses/EditConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/content/items/{itemCode}/comments:
    post:
      tags: [items]
      operationId: commentItem
      summary: Comenta el ítem (docentes y administradores); queda en la historia
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ItemCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201':
          description: Comentario registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/content/items/{itemCode}/history:
    get:
      tags: [items]
      operationId: getItemHistory
      summary: Versiones y eventos del ítem (FR-018)
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ItemCode'
      responses:
        '200':
          description: Historia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/content/items/{itemCode}/versions/{versionNumber}:
    get:
      tags: [items]
      operationId: getItemVersion
      summary: Contenido completo de una versión y sus diferencias con la anterior
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ItemCode'
        - $ref: '#/components/parameters/VersionNumber'
      responses:
        '200':
          description: Versión
          content:
            application/json:
              schema:
                type: object
                required: [version, changes]
                properties:
                  version: { $ref: '#/components/schemas/ItemVersion' }
                  changes:
                    type: array
                    description: Vacío en la versión 1
                    items: { $ref: '#/components/schemas/FieldChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/content/items/{itemCode}/statistics:
    get:
      tags: [insights]
      operationId: getItemStatistics
      summary: Estadísticas por versión publicada o retirada (FR-041 a FR-044)
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ItemCode'
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VersionStatistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- importación y exportación
  /api/v1/content/import-template:
    get:
      tags: [transfer]
      operationId: getImportTemplate
      summary: Plantilla XLSX de ítems de selección con instrucciones y listas de códigos (R-04)
      x-requires-privileged-session: true
      x-required-permission: content:author
      responses:
        '200':
          description: Plantilla
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/content/imports:
    get:
      tags: [transfer]
      operationId: listImports
      summary: Importaciones recientes (propias; todas para el Administrador)
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Importaciones
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ImportSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [transfer]
      operationId: createImport
      summary: Valida un archivo JSON o XLSX y devuelve la vista previa sin guardar ítems (FR-030)
      x-requires-privileged-session: true
      x-required-permission: content:author
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: '`.json` (formato del banco inicial) o `.xlsx` (plantilla); máximo 10 MB y 1 000 ítems'
      responses:
        '201':
          description: Importación pendiente con su vista previa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Más de 10 MB o de 1 000 ítems (`file-too-large`, `batch-too-large`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Formato no reconocido (`unsupported-file-format`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            El archivo no se puede leer como un todo (`unreadable-file`): esquema distinto,
            columnas faltantes o codificación ilegible. Los errores por ítem no son 422: van en
            la vista previa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/content/imports/{importId}:
    get:
      tags: [transfer]
      operationId: getImport
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - name: action
          in: query
          required: false
          description: Filtra las filas por resultado
          schema: { $ref: '#/components/schemas/ImportAction' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Importación con sus filas paginadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/content/imports/{importId}/report:
    get:
      tags: [transfer]
      operationId: getImportReport
      summary: Reporte descargable de los ítems con error (FR-033)
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Reporte (código, campo, regla y mensaje por fila)
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/content/imports/{importId}/confirmation:
    post:
      tags: [transfer]
      operationId: confirmImport
      summary: Aplica los ítems válidos en una transacción (FR-034 a FR-036)
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ImportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_state, originality_declared]
              additionalProperties: false
              properties:
                target_state:
                  type: string
                  enum: [draft, in_review]
                  description: Estado de los ítems nuevos y de las versiones nuevas (los de origen `ia` entran En revisión)
                originality_declared:
                  type: boolean
                  const: true
                  description: Los ítems son originales y no reproducen preguntas del ICFES
      responses:
        '200':
          description: Aplicada; `result` dice qué se creó, versionó u omitió
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya confirmada o vencida (`import-not-pending`), o sin ítems válidos (`nothing-to-import`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/content/export:
    get:
      tags: [transfer]
      operationId: exportItems
      summary: Exporta el banco o un filtro en el formato de importación (FR-038, SC-010)
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [json, xlsx] }
        - name: version
          in: query
          required: false
          description: Versión de cada ítem que se exporta
          schema: { type: string, enum: [published, latest], default: published }
        - { name: module, in: query, required: false, schema: { $ref: '#/components/schemas/ModuleCodeValue' } }
        - { name: state, in: query, required: false, schema: { $ref: '#/components/schemas/VersionState' } }
        - { name: origin, in: query, required: false, schema: { $ref: '#/components/schemas/Origin' } }
        - { name: difficulty, in: query, required: false, schema: { $ref: '#/components/schemas/Difficulty' } }
        - { name: taxonomy_node, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: |
            Archivo. `X-Skipped-Items` indica cuántos ítems no caben en la plantilla XLSX
            (Inglés parte 1, contextos con imagen o tabla y consignas).
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Skipped-Items: { schema: { type: integer, minimum: 0 } }
          content:
            application/json:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------- cobertura
  /api/v1/content/coverage/{moduleCode}:
    get:
      tags: [insights]
      operationId: getModuleCoverage
      summary: Cobertura del módulo frente a la distribución objetivo (FR-039, SC-009)
      x-requires-privileged-session: true
      x-required-permission: content:author
      parameters:
        - $ref: '#/components/parameters/ModuleCode'
      responses:
        '200':
          description: Cobertura
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleCoverage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    ETag:
      description: Revisión del recurso para `If-Match` (research R-09)
      schema: { type: string, examples: ['"7"'] }

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Revisión que la persona estaba editando (`"7"` o `W/"7"`). Sin ella, o mal formada, 428
        `precondition-required`; si no coincide con la actual, 412 `edit-conflict` (research R-09).
      schema: { type: string, pattern: '^\s*(W/)?"[0-9]{1,9}"\s*$' }
    ModuleCode:
      name: moduleCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ModuleCodeValue' }
    NodeId:
      { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
    RubricId:
      { name: rubricId, in: path, required: true, schema: { type: string, format: uuid } }
    MediaId:
      { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    ImportId:
      { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    ItemCode:
      name: itemCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BusinessCode' }
    ContextCode:
      name: contextCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BusinessCode' }
    VersionNumber:
      { name: versionNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }

  responses:
    Unauthorized:
      description: |
        Sin sesión válida. `type`: `unauthenticated`, `session-revoked`, `account-disabled`,
        `guest-access-expired`, `guest-access-revoked` o `reauthentication-required`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: El rol no permite esta función (`forbidden`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No existe o está fuera del alcance del usuario (`not-found`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Datos inválidos (`validation-error`); `errors[]` trae el campo y la regla
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Demasiadas solicitudes (`rate-limited`)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidTransition:
      description: La acción no aplica al estado actual (`invalid-transition`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EditConflict:
      description: |
        Otra persona modificó el recurso (`edit-conflict`). `current` trae el estado actual para
        que la interfaz muestre ambas versiones (FR-027).
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Problem' }
              - type: object
                properties:
                  current: { type: object, description: '`Item` o `Context` actual' }
                  etag: { type: string }
    PreconditionRequired:
      description: Falta `If-Match` (`precondition-required`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------------------------------------------------------- comunes (idénticos a 001)
    Problem:
      type: object
      description: RFC 9457 Problem Details. `detail` está en español y nunca contiene datos personales.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ['urn:saber-uli:problem:self-approval-forbidden']
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          description: Errores de validación por campo
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
              rule: { type: string, description: 'Regla incumplida (catálogo `ValidationRule`)' }
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

    # ---------------------------------------------------------- valores
    BusinessCode:
      type: string
      pattern: '^[A-Z]{2,3}(-[A-Z0-9]+){1,3}$'
      maxLength: 32
      examples: ['LC-0001', 'ING-CTX-P1-001']
    ModuleCodeValue:
      type: string
      enum: [LC, RC, CC, ING, CE]
    VersionState:
      type: string
      enum: [draft, in_review, published, retired]
    Origin:
      type: string
      enum: [seed, teacher, ai]
    Difficulty:
      type: string
      enum: [low, medium, high]
    ItemKind:
      type: string
      enum: [selection, matching, writing_prompt]
    ProblemSignal:
      type: string
      enum: [too_easy, too_hard, negative_discrimination, distractor_beats_key]
    ValidationRule:
      type: string
      description: Catálogo de reglas de validación del contenido (FR-031)
      enum:
        - required
        - invalid_value
        - single_correct_option
        - option_count
        - option_feedback_required
        - explanation_required
        - taxonomy_unknown
        - taxonomy_inactive
        - taxonomy_mismatch
        - context_unknown
        - context_word_limit
        - alt_text_required
        - matching_key_unknown
        - duplicate_item
        - duplicate_in_file
        - unsupported_in_template
        - context_text_mismatch
        - rubric_unknown
        - changed_since_preview
    UserRef:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name:
          type: string
          description: Nombre para mostrar; "Cuenta eliminada" si la cuenta fue suprimida (R-14)

    # ---------------------------------------------------------- taxonomía
    ContentModule:
      type: object
      required: [code, name, question_type, exam_questions, bank_target, nodes]
      properties:
        code: { $ref: '#/components/schemas/ModuleCodeValue' }
        name: { type: string }
        question_type: { type: string, enum: [selection, writing] }
        options_per_item: { type: [integer, 'null'] }
        max_context_words: { type: [integer, 'null'] }
        exam_questions: { type: integer }
        bank_target: { type: integer }
        nodes:
          type: array
          description: Categorías en orden; el árbol se arma con `parent_id`
          items: { $ref: '#/components/schemas/TaxonomyNode' }
    TaxonomyNodeKind:
      type: string
      enum: [competence, assertion, evidence, component, situation, text_type, part]
    TaxonomyNode:
      type: object
      required: [id, module, kind, code, name, active, in_use]
      properties:
        id: { type: string, format: uuid }
        module: { $ref: '#/components/schemas/ModuleCodeValue' }
        kind: { $ref: '#/components/schemas/TaxonomyNodeKind' }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        parent_id: { type: [string, 'null'], format: uuid }
        target_weight: { type: [number, 'null'], minimum: 0, maximum: 1 }
        part_options: { type: [integer, 'null'] }
        part_format: { type: [string, 'null'], enum: [matching, selection, null] }
        active: { type: boolean }
        in_use: { type: boolean, description: 'La usa algún ítem o contexto (no se puede borrar)' }
        warnings:
          type: array
          items: { type: string }
    TaxonomyNodeCreate:
      type: object
      required: [module, kind, code, name]
      additionalProperties: false
      properties:
        module: { $ref: '#/components/schemas/ModuleCodeValue' }
        kind: { $ref: '#/components/schemas/TaxonomyNodeKind' }
        code: { type: string, pattern: '^[A-Z]{2,3}-[A-Z0-9.-]{1,20}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        parent_id: { type: string, format: uuid }
        target_weight: { type: number, minimum: 0, maximum: 1 }
        part_options: { type: integer, minimum: 2, maximum: 8 }
        part_format: { type: string, enum: [matching, selection] }
    TaxonomyNodeUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 1000 }
        target_weight: { type: [number, 'null'], minimum: 0, maximum: 1 }
        active: { type: boolean }
    Rubric:
      allOf:
        - { $ref: '#/components/schemas/RubricInput' }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    RubricInput:
      type: object
      required: [code, name, relevance_condition, dimensions, active]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^RUB-[A-Z0-9-]{1,20}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 1000 }
        active: { type: boolean }
        relevance_condition:
          type: object
          required: [name, description]
          properties:
            name: { type: string }
            description: { type: string }
        dimensions:
          type: array
          minItems: 1
          items:
            type: object
            required: [code, name, levels]
            properties:
              code: { type: string }
              name: { type: string }
              levels:
                type: array
                minItems: 2
                items:
                  type: object
                  required: [level, description]
                  properties:
                    level: { type: integer, minimum: 1 }
                    description: { type: string }

    # ---------------------------------------------------------- contextos
    Media:
      type: object
      required: [id, content_type, width, height, size_bytes, url]
      properties:
        id: { type: string, format: uuid }
        content_type: { type: string, enum: [image/png, image/jpeg, image/webp] }
        width: { type: integer }
        height: { type: integer }
        size_bytes: { type: integer }
        url: { type: string, description: 'Ruta de `getContentMedia`' }
    SharedOption:
      type: object
      required: [key, text, feedback]
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[A-H]$' }
        text: { type: string, minLength: 1, maxLength: 500 }
        feedback: { type: string, minLength: 1, maxLength: 2000 }
    ContextContent:
      type: object
      required: [kind, title]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [text, table, image, shared_options] }
        title: { type: string, minLength: 1, maxLength: 200 }
        body_md: { type: [string, 'null'], maxLength: 20000 }
        media_id: { type: [string, 'null'], format: uuid }
        alt_text: { type: [string, 'null'], maxLength: 1000 }
        text_type_node_id: { type: [string, 'null'], format: uuid }
        part_node_id: { type: [string, 'null'], format: uuid }
        subtype: { type: [string, 'null'], maxLength: 60 }
        shared_options:
          type: [array, 'null']
          minItems: 2
          maxItems: 8
          description: El dominio exige exactamente `part_options` de la parte (8 en la parte 1, FR-003)
          items: { $ref: '#/components/schemas/SharedOption' }
    ContextCreate:
      allOf:
        - { $ref: '#/components/schemas/ContextContent' }
        - type: object
          required: [code, module]
          properties:
            code: { $ref: '#/components/schemas/BusinessCode' }
            module: { $ref: '#/components/schemas/ModuleCodeValue' }
    ContextSummary:
      type: object
      required: [code, module, kind, title, version, item_count, published_item_count]
      properties:
        code: { $ref: '#/components/schemas/BusinessCode' }
        module: { $ref: '#/components/schemas/ModuleCodeValue' }
        kind: { type: string, enum: [text, table, image, shared_options] }
        title: { type: string }
        version: { type: integer }
        word_count: { type: [integer, 'null'] }
        item_count: { type: integer, description: Ítems que lo usan (FR-026) }
        published_item_count: { type: integer }
    Context:
      allOf:
        - { $ref: '#/components/schemas/ContextSummary' }
        - { $ref: '#/components/schemas/ContextContent' }
        - type: object
          required: [origin, updated_at, revision]
          properties:
            origin: { $ref: '#/components/schemas/Origin' }
            updated_at: { type: string, format: date-time }
            revision: { type: integer, description: Igual al ETag }
            items:
              type: array
              items:
                type: object
                required: [code, state]
                properties:
                  code: { $ref: '#/components/schemas/BusinessCode' }
                  state: { $ref: '#/components/schemas/VersionState' }
    ContextUpdateResult:
      type: object
      required: [context, new_review_versions, rebased_open_versions]
      properties:
        context: { $ref: '#/components/schemas/Context' }
        new_review_versions:
          type: array
          description: Ítems publicados que recibieron una versión nueva En revisión (FR-020)
          items: { $ref: '#/components/schemas/BusinessCode' }
        rebased_open_versions:
          type: array
          description: Versiones abiertas que pasaron a la nueva versión del contexto
          items: { $ref: '#/components/schemas/BusinessCode' }

    # ---------------------------------------------------------- ítems
    Option:
      type: object
      required: [key, text, correct, feedback]
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[A-D]$' }
        text: { type: string, minLength: 1, maxLength: 2000 }
        correct: { type: boolean }
        feedback: { type: string, maxLength: 2000, description: 'Obligatoria al enviar a revisión (FR-006)' }
    TaxonomyTags:
      type: object
      additionalProperties: false
      description: Obligatoriedad según el módulo (FR-002, FR-003)
      properties:
        competence_id: { type: [string, 'null'], format: uuid }
        assertion_id: { type: [string, 'null'], format: uuid }
        evidence_id: { type: [string, 'null'], format: uuid }
        component_id: { type: [string, 'null'], format: uuid }
        situation_id: { type: [string, 'null'], format: uuid }
        part_id: { type: [string, 'null'], format: uuid }
    ItemContent:
      type: object
      required: [difficulty, stem_md, explanation_md, taxonomy]
      additionalProperties: false
      description: |
        Contenido de una versión. En un Borrador se aceptan campos incompletos (salvo los
        requeridos aquí); la validez completa se exige al enviar a revisión (FR-024).
      properties:
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        context_code: { oneOf: [{ $ref: '#/components/schemas/BusinessCode' }, { type: 'null' }] }
        taxonomy: { $ref: '#/components/schemas/TaxonomyTags' }
        stem_md: { type: string, maxLength: 5000, description: 'Enunciado; en CE, la pregunta' }
        options:
          type: [array, 'null']
          maxItems: 4
          items: { $ref: '#/components/schemas/Option' }
        answer_key: { type: [string, 'null'], pattern: '^[A-H]$', description: 'Solo `matching`' }
        explanation_md: { type: string, maxLength: 5000 }
        prompt_context_md: { type: [string, 'null'], maxLength: 5000, description: 'Solo CE' }
        rubric_id: { type: [string, 'null'], format: uuid, description: 'Solo CE' }
    ItemDraftInput:
      $ref: '#/components/schemas/ItemContent'
    ItemCreate:
      type: object
      required: [code, module, kind, content]
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/BusinessCode' }
        module: { $ref: '#/components/schemas/ModuleCodeValue' }
        kind: { $ref: '#/components/schemas/ItemKind' }
        content: { $ref: '#/components/schemas/ItemContent' }
    ItemVersion:
      type: object
      required: [number, state, content, content_issues, author, contributors, created_at]
      properties:
        number: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/VersionState' }
        content: { $ref: '#/components/schemas/ItemContent' }
        context_version: { type: [integer, 'null'], description: 'Versión del contexto que fija (R-02)' }
        content_issues:
          type: array
          description: Problemas que impiden enviarla a revisión (vacío si está completa)
          items:
            type: object
            required: [field, rule, message]
            properties:
              field: { type: string }
              rule: { $ref: '#/components/schemas/ValidationRule' }
              message: { type: string }
        author: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        contributors:
          type: array
          items: { $ref: '#/components/schemas/UserRef' }
        reviewer: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
        submitted_at: { type: [string, 'null'], format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
        retired_at: { type: [string, 'null'], format: date-time }
        retire_reason: { type: [string, 'null'] }
    ItemSummary:
      type: object
      required: [code, module, kind, origin, difficulty, stem_excerpt, published_version, open_version, updated_at]
      properties:
        code: { $ref: '#/components/schemas/BusinessCode' }
        module: { $ref: '#/components/schemas/ModuleCodeValue' }
        kind: { $ref: '#/components/schemas/ItemKind' }
        origin: { $ref: '#/components/schemas/Origin' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        stem_excerpt: { type: string, maxLength: 160 }
        context_code: { oneOf: [{ $ref: '#/components/schemas/BusinessCode' }, { type: 'null' }] }
        assertion_code: { type: [string, 'null'] }
        part_code: { type: [string, 'null'] }
        published_version: { type: [integer, 'null'] }
        open_version:
          oneOf:
            - type: object
              required: [number, state]
              properties:
                number: { type: integer }
                state: { type: string, enum: [draft, in_review] }
            - type: 'null'
        retired: { type: boolean, description: 'Todas sus versiones están Retiradas' }
        needs_another_reviewer:
          type: boolean
          description: Ningún administrador disponible puede aprobarla (todos la modificaron)
        signals:
          type: array
          items: { $ref: '#/components/schemas/ProblemSignal' }
        updated_at: { type: string, format: date-time }
    Item:
      type: object
      required: [code, module, kind, origin, revision, published, open, can]
      properties:
        code: { $ref: '#/components/schemas/BusinessCode' }
        module: { $ref: '#/components/schemas/ModuleCodeValue' }
        kind: { $ref: '#/components/schemas/ItemKind' }
        origin: { $ref: '#/components/schemas/Origin' }
        revision: { type: integer, description: 'Igual al ETag (R-09)' }
        published: { oneOf: [{ $ref: '#/components/schemas/ItemVersion' }, { type: 'null' }] }
        open: { oneOf: [{ $ref: '#/components/schemas/ItemVersion' }, { type: 'null' }] }
        last_review_comment: { type: [string, 'null'], description: 'Comentario de la última devolución' }
        can:
          type: object
          description: Acciones que quien consulta puede hacer ahora (para la interfaz)
          required: [edit, submit, approve, return, reject, retire]
          properties:
            edit: { type: boolean }
            submit: { type: boolean }
            approve: { type: boolean }
            return: { type: boolean }
            reject: { type: boolean }
            retire: { type: boolean }
            approve_blocked_reason:
              type: [string, 'null']
              enum: [self_approval, null]
    CommentInput:
      type: object
      required: [comment]
      additionalProperties: false
      properties:
        comment: { type: string, minLength: 1, maxLength: 2000 }
    ReasonInput:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ItemEventType:
      type: string
      enum: [created, edited, submitted, approved, returned, rejected, retired, superseded,
             commented, imported, seed_loaded, seed_versioned, context_changed, rebased_on_context]
    ItemEvent:
      type: object
      required: [id, type, occurred_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ItemEventType' }
        version: { type: [integer, 'null'] }
        actor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: 'null = sistema' }
        occurred_at: { type: string, format: date-time }
        comment: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        details: { type: object }
    ItemHistory:
      type: object
      required: [versions, events]
      properties:
        versions:
          type: array
          items:
            type: object
            required: [number, state, created_at]
            properties:
              number: { type: integer }
              state: { $ref: '#/components/schemas/VersionState' }
              author: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
              reviewer: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
              created_at: { type: string, format: date-time }
              published_at: { type: [string, 'null'], format: date-time }
              retired_at: { type: [string, 'null'], format: date-time }
              changed_fields:
                type: array
                description: Campos que cambiaron frente a la versión anterior
                items: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/ItemEvent' }
    FieldChange:
      type: object
      required: [field]
      properties:
        field: { type: string, examples: ['stem_md', 'options[B].feedback', 'taxonomy.assertion_id'] }
        before: {}
        after: {}

    # ---------------------------------------------------------- importación
    ImportAction:
      type: string
      enum: [create, update, unchanged, error]
    ImportRow:
      type: object
      required: [code, entity, action]
      properties:
        code: { type: string, description: 'Código del ítem, consigna o contexto (o "fila N" si falta)' }
        entity: { type: string, enum: [item, writing_prompt, context, rubric, taxonomy_node] }
        action: { $ref: '#/components/schemas/ImportAction' }
        target_state:
          type: [string, 'null']
          enum: [draft, in_review, null]
          description: 'Estado con que entraría; `in_review` forzado para origen `ia`'
        changes:
          type: array
          items: { $ref: '#/components/schemas/FieldChange' }
        errors:
          type: array
          items:
            type: object
            required: [field, rule, message]
            properties:
              field: { type: string }
              rule: { $ref: '#/components/schemas/ValidationRule' }
              message: { type: string }
    ImportSummary:
      type: object
      required: [id, status, source_name, format, created_at, expires_at, created_by, counts]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, confirmed, expired] }
        source_name: { type: string }
        format: { type: string, enum: [json, xlsx] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }
        created_by: { $ref: '#/components/schemas/UserRef' }
        counts:
          type: object
          required: [create, update, unchanged, error]
          properties:
            create: { type: integer }
            update: { type: integer }
            unchanged: { type: integer }
            error: { type: integer }
    ImportDetail:
      allOf:
        - { $ref: '#/components/schemas/ImportSummary' }
        - type: object
          required: [rows, meta]
          properties:
            rows:
              type: array
              items: { $ref: '#/components/schemas/ImportRow' }
            meta: { $ref: '#/components/schemas/PageMeta' }
            result:
              oneOf:
                - type: object
                  required: [created, versioned, skipped]
                  properties:
                    created: { type: integer }
                    versioned: { type: integer }
                    skipped:
                      type: array
                      description: Ítems omitidos al confirmar (`changed_since_preview`)
                      items: { $ref: '#/components/schemas/BusinessCode' }
                - type: 'null'

    # ---------------------------------------------------------- cobertura y estadísticas
    ModuleCoverage:
      type: object
      required: [module, grouped_by, bank_target, published_total, in_review_total, categories]
      properties:
        module: { $ref: '#/components/schemas/ModuleCodeValue' }
        grouped_by: { $ref: '#/components/schemas/TaxonomyNodeKind' }
        bank_target: { type: integer }
        published_total: { type: integer }
        in_review_total: { type: integer }
        categories:
          type: array
          items:
            type: object
            required: [node_id, code, name, published, in_review, published_share, missing, below_target]
            properties:
              node_id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              target_weight: { type: [number, 'null'] }
              published: { type: integer }
              in_review: { type: integer }
              published_share: { type: number, minimum: 0, maximum: 1 }
              missing:
                type: integer
                minimum: 0
                description: Ítems publicados que faltan para el objetivo (`bank_target × target_weight`)
              below_target: { type: boolean }
    VersionStatistics:
      type: object
      required: [version, state, first_responses, sufficient_data, signals]
      properties:
        version: { type: integer }
        state: { type: string, enum: [published, retired] }
        first_responses: { type: integer, minimum: 0 }
        sufficient_data: { type: boolean, description: 'false con menos de 30 respuestas (FR-042)' }
        correct_rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
        option_rates:
          type: [object, 'null']
          additionalProperties: { type: number, minimum: 0, maximum: 1 }
        discrimination: { type: [number, 'null'], minimum: -1, maximum: 1 }
        signals:
          type: array
          items: { $ref: '#/components/schemas/ProblemSignal' }
        computed_at: { type: [string, 'null'], format: date-time }
